name: Native Unix packages
on:
  workflow_call:
    inputs:
      publisher_trust:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA or immutable release tag (resolved once)
        required: true
        type: string
      publisher_trust:
        description: Embed reviewed preview publisher trust and test managed installation
        required: false
        default: false
        type: boolean
      verify_public:
        description: Verify published signed assets and automatic checks on native workers
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    if: ${{ !inputs.verify_public }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            platform: linux
            architecture: x86_64
          - os: macos-26
            target: macos-arm64
            platform: macos
            architecture: arm64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            platform: linux
            architecture: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: inputs.publisher_trust
        with:
          ref: ${{ github.sha }}
          path: dev-artifacts/publisher-tooling
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - if: runner.os == 'Linux'
        run: bash scripts/prepare_linux_update_ci.sh
      - run: python -m pip install --require-hashes -r packaging/requirements-build.lock
      - run: python -B scripts/provision_ci_sqlite.py
      - run: python -B scripts/provision_ci_ripgrep.py
      - run: bun install --frozen-lockfile
        working-directory: cli/dashboard
      - run: python -B scripts/verify_release_privacy.py --root .
      - name: Darwin object reads approvals and governance
        if: runner.os == 'macOS'
        run: >-
          python -B -m pytest tests/test_sandbox_read.py tests/test_sandbox_read_darwin.py
          tests/test_read_approval.py tests/test_read_execution_plan.py tests/test_governance_chain.py
          tests/test_alpha3_platform_boundaries.py -q --tb=short
      - name: Native installer, credentials and owned process source regressions
        run: python -B -m pytest tests/test_unix_install_transaction.py tests/test_uninstall_cleanup_order.py tests/test_secret_cleanup_failures.py tests/test_unix_process_scope.py -q
      - name: CAS format admission and process ordering foundations (not sandbox backend acceptance)
        run: python -B -m pytest tests/test_cas_lifecycle_ordering.py tests/test_cas_inventory.py tests/test_storage_ownership_handoff.py tests/test_storage_binding_retirement.py tests/test_storage_envelope.py tests/test_storage_host_records.py tests/test_storage_runtime_manifest.py tests/test_storage_slot_records.py tests/test_storage_runtime_records.py tests/test_storage_wal_capacity.py tests/test_checkpoint_limits.py tests/test_checkpoint_work.py tests/test_checkpoint_binding.py tests/test_storage_project_registration.py tests/test_checkpoint_facts.py tests/test_storage_repository_outcomes.py tests/test_checkpoint_planning.py tests/test_runtime_facts.py tests/test_storage_protocol_admission.py -q
      - name: Build complete native archive
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          extra=()
          if [ "${{ inputs.publisher_trust }}" = true ]; then
            python -B dev-artifacts/publisher-tooling/scripts/check_unix_release_delivery.py policy --source . --platform "${{ matrix.platform }}" --architecture "${{ matrix.architecture }}" --output "$RUNNER_TEMP/publisher-policy.json"
            extra=(--update-evidence --update-release-policy "$RUNNER_TEMP/publisher-policy.json")
          fi
          bash "packaging/build_${TARGET_PLATFORM}.sh" --python "$(command -v python)" --bun "$(command -v bun)" "${extra[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.target }}-${{ needs.resolve.outputs.commit }}
          path: dist-installer/*
          if-no-files-found: error
          retention-days: 14
  accept:
    needs: [resolve, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-26
            target: macos-arm64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: inputs.publisher_trust
        with:
          ref: ${{ github.sha }}
          path: dev-artifacts/publisher-tooling
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
      - name: Install test harness only (no SQLite/ripgrep build provisioning)
        run: python -m pip install --require-hashes -r packaging/requirements-build.lock
      - if: runner.os == 'Linux'
        run: bash scripts/prepare_linux_update_ci.sh
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libsecret-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-${{ matrix.target }}-${{ needs.resolve.outputs.commit }}
          path: incoming
      - name: Test final archive on an independent native worker
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
          TARGET: ${{ matrix.target }}
          PUBLISHER_TRUST: ${{ inputs.publisher_trust }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash -euc '
              printf "disposable-ci-fixture" | gnome-keyring-daemon --unlock --components=secrets
              python -B scripts/accept_unix_archive.py --archive "incoming/gitgo-${TARGET}.tar.gz" --commit "$SOURCE_COMMIT" --report acceptance.json
              if [ "$PUBLISHER_TRUST" = true ]; then
                python -B dev-artifacts/publisher-tooling/scripts/check_unix_release_delivery.py managed --source . --archive "incoming/gitgo-${TARGET}.tar.gz" --commit "$SOURCE_COMMIT" --output managed-acceptance.json
              fi
            '
          else
            # Disposable native fixture; never unlock or modify login credentials.
            keychain_dir="$(mktemp -d "$RUNNER_TEMP/gitgo-ci-keychain.XXXXXXXX")"
            keychain="$keychain_dir/fixture.keychain-db"
            security create-keychain -p disposable-ci-fixture "$keychain"
            trap 'security delete-keychain "$keychain"' EXIT
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p disposable-ci-fixture "$keychain"
            security list-keychains -d user -s "$keychain"
            security default-keychain -d user -s "$keychain"
            python -B scripts/accept_unix_archive.py --archive "incoming/gitgo-${TARGET}.tar.gz" --commit "$SOURCE_COMMIT" --report acceptance.json
            if [ "$PUBLISHER_TRUST" = true ]; then
              python -B dev-artifacts/publisher-tooling/scripts/check_unix_release_delivery.py managed --source . --archive "incoming/gitgo-${TARGET}.tar.gz" --commit "$SOURCE_COMMIT" --output managed-acceptance.json
            fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-${{ matrix.target }}-${{ needs.resolve.outputs.commit }}
          path: |
            acceptance.json
            managed-acceptance.json
          if-no-files-found: error
          retention-days: 14

  published:
    needs: resolve
    if: ${{ inputs.verify_public }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            architecture: x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            architecture: aarch64
          - os: macos-26
            platform: macos
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: dev-artifacts/publisher-tooling
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
      - run: python -m pip install --require-hashes -r packaging/requirements-build.lock
      - if: runner.os == 'Linux'
        run: bash scripts/prepare_linux_update_ci.sh
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libsecret-tools
      - name: Anonymous public download, signature, inventory, managed install and automatic check
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.architecture }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash -euc '
              printf "disposable-ci-fixture" | gnome-keyring-daemon --unlock --components=secrets
              python -B dev-artifacts/publisher-tooling/scripts/check_unix_release_delivery.py published --source . --platform "$TARGET_PLATFORM" --architecture "$TARGET_ARCH" --commit "$SOURCE_COMMIT" --output published-acceptance.json
            '
          else
            keychain_dir="$(mktemp -d "$RUNNER_TEMP/gitgo-ci-keychain.XXXXXXXX")"
            keychain="$keychain_dir/fixture.keychain-db"
            security create-keychain -p disposable-ci-fixture "$keychain"
            trap 'security delete-keychain "$keychain"' EXIT
            security unlock-keychain -p disposable-ci-fixture "$keychain"
            security list-keychains -d user -s "$keychain"
            security default-keychain -d user -s "$keychain"
            python -B dev-artifacts/publisher-tooling/scripts/check_unix_release_delivery.py published --source . --platform "$TARGET_PLATFORM" --architecture "$TARGET_ARCH" --commit "$SOURCE_COMMIT" --output published-acceptance.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-${{ matrix.platform }}-${{ matrix.architecture }}-${{ needs.resolve.outputs.commit }}
          path: published-acceptance.json
          if-no-files-found: error
          retention-days: 14
