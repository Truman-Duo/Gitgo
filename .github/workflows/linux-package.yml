name: Native Unix packages
on:
  workflow_call:
    inputs:
      publisher_trust:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA or immutable release tag (resolved once)
        required: true
        type: string
      publisher_trust:
        description: Embed reviewed preview publisher trust and test managed installation
        required: false
        default: false
        type: boolean
      verify_public:
        description: Verify published signed assets and automatic checks on native workers
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  target:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            platform: linux
            architecture: x86_64
          - os: macos-26
            target: macos-arm64
            platform: macos
            architecture: arm64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            platform: linux
            architecture: aarch64
    uses: ./.github/workflows/unix-target.yml
    with:
      commit: ${{ needs.resolve.outputs.commit }}
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      platform: ${{ matrix.platform }}
      architecture: ${{ matrix.architecture }}
      publisher_trust: ${{ inputs.publisher_trust || false }}
      verify_public: ${{ inputs.verify_public || false }}
