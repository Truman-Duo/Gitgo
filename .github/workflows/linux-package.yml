name: Native Unix packages
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA or immutable release tag (resolved once)
        required: true
        type: string
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            platform: linux
          - os: macos-15
            target: macos-arm64
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - run: python -m pip install --require-hashes -r packaging/requirements-build.lock
      - run: python -B scripts/provision_ci_sqlite.py
      - run: python -B scripts/provision_ci_ripgrep.py
      - run: bun install --frozen-lockfile
        working-directory: cli/dashboard
      - run: python -B scripts/verify_release_privacy.py --root .
      - name: Native installer, credentials and owned process source regressions
        run: python -B -m pytest tests/test_unix_install_transaction.py tests/test_uninstall_cleanup_order.py tests/test_secret_cleanup_failures.py tests/test_unix_process_scope.py -q
      - name: CAS format admission and process ordering foundations (not sandbox backend acceptance)
        run: python -B -m pytest tests/test_cas_lifecycle_ordering.py tests/test_storage_ownership_handoff.py tests/test_storage_binding_retirement.py tests/test_storage_protocol_admission.py -q
      - name: Build complete native archive
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: bash "packaging/build_${TARGET_PLATFORM}.sh" --python "$(command -v python)" --bun "$(command -v bun)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.target }}-${{ needs.resolve.outputs.commit }}
          path: dist-installer/*
          if-no-files-found: error
          retention-days: 14
  accept:
    needs: [resolve, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
      - name: Install test harness only (no SQLite/ripgrep build provisioning)
        run: python -m pip install --require-hashes -r packaging/requirements-build.lock
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libsecret-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-${{ matrix.target }}-${{ needs.resolve.outputs.commit }}
          path: incoming
      - name: Test final archive on an independent native worker
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash -euc '
              printf "disposable-ci-fixture" | gnome-keyring-daemon --unlock --components=secrets
              python -B scripts/accept_unix_archive.py --archive "incoming/gitgo-${TARGET}.tar.gz" --commit "$SOURCE_COMMIT" --report acceptance.json
            '
          else
            # Disposable native fixture; never unlock or modify login credentials.
            keychain_dir="$(mktemp -d "$RUNNER_TEMP/gitgo-ci-keychain.XXXXXXXX")"
            keychain="$keychain_dir/fixture.keychain-db"
            security create-keychain -p disposable-ci-fixture "$keychain"
            trap 'security delete-keychain "$keychain"' EXIT
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p disposable-ci-fixture "$keychain"
            security list-keychains -d user -s "$keychain"
            security default-keychain -d user -s "$keychain"
            python -B scripts/accept_unix_archive.py --archive "incoming/gitgo-${TARGET}.tar.gz" --commit "$SOURCE_COMMIT" --report acceptance.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-${{ matrix.target }}-${{ needs.resolve.outputs.commit }}
          path: acceptance.json
          if-no-files-found: error
          retention-days: 14
