name: Gitgo CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

concurrency:
  group: gitgo-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: PR contract and upstream alignment
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      native_required: ${{ steps.contract.outputs.native_required }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: upstream
          persist-credentials: false
      - name: Verify gate regressions
        run: python3 -I -B candidate/tests/test_ci_pr_contract.py
      - name: Verify PR version, declared boundaries, and upstream ancestry
        id: contract
        working-directory: candidate
        run: python3 -I -B scripts/check_pr_contract.py --root . --base-root ../upstream
      - name: Record tested candidate and integration tree
        working-directory: candidate
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          python3 -I -B - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          evidence = {'event': os.environ['GITHUB_EVENT_NAME'], 'head': os.environ.get('PR_HEAD'),
              'observed_base': os.environ.get('PR_BASE'), 'tested_commit': git('rev-parse', 'HEAD'),
              'tested_tree': git('rev-parse', 'HEAD^{tree}'), 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'formal_terminal_verified': False}
          Path('ci-evidence.json').write_text(json.dumps(evidence, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-candidate-evidence
          path: candidate/ci-evidence.json
          if-no-files-found: error
          retention-days: 14

  privacy:
    name: Tracked-file privacy boundary
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: python3 -B scripts/verify_release_privacy.py --root .

  python-windows:
    name: Windows source regression
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install test dependencies
        run: python -m pip install -r requirements-portable.txt pytest
      - name: Prepare canonical test temporary directory
        run: |
          @'
          import os
          from pathlib import Path
          # Managed NTFS tests reject the shared scratch drive's writable ACL.
          root = (Path(os.environ['USERPROFILE']) / 'AppData/Local/Temp').resolve(strict=True) / 'gitgo-tests'
          root.mkdir(exist_ok=True)
          root = root.resolve(strict=True)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              output.write(f'TEMP={root}\nTMP={root}\n')
          print(f'Test temporary directory: {root}')
          '@ | python -I -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate pinned SQLite and ripgrep
        run: |
          python -B scripts/provision_ci_sqlite.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/provision_ci_ripgrep.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GITGO_BUN=$((Get-Command bun).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python --version
      - name: Full Python suite
        run: python -B -m pytest tests -q --junitxml=ci-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-source-results
          path: ci-tests.xml
          if-no-files-found: warn
          retention-days: 14

  dashboard:
    name: Dashboard tests and production build
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - working-directory: cli/dashboard
        run: bun install --frozen-lockfile
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Sparse full-frame overwrite regression
        run: python -B -c "from tests.test_terminal_screen import assert_renderer_full_paint; assert_renderer_full_paint('bun')"
      - working-directory: cli/dashboard
        run: bun test
      - working-directory: cli/dashboard
        run: bun run build

  native:
    needs: contract
    if: needs.contract.outputs.native_required == 'true'
    uses: ./.github/workflows/native-acceptance.yml
    with:
      os: windows-latest

  native-linux:
    needs: contract
    if: needs.contract.outputs.native_required == 'true'
    uses: ./.github/workflows/native-acceptance.yml
    with:
      os: ubuntu-22.04

  runtime:
    uses: ./.github/workflows/dashboard-runtime.yml

  unix-packages:
    uses: ./.github/workflows/linux-package.yml

  managed-update-windows:
    uses: ./.github/workflows/windows-update.yml

  managed-update-linux:
    uses: ./.github/workflows/linux-update.yml

  windows-package:
    name: Windows final ZIP and frozen continuity
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: python -m pip install --require-hashes -r packaging/requirements-build.lock
      - run: python -B scripts/provision_ci_sqlite.py
      - run: python -B scripts/provision_ci_ripgrep.py
      - working-directory: cli/dashboard
        run: bun install --frozen-lockfile
      - name: Prepare private final-package directories
        run: |
          $private = Join-Path $env:USERPROFILE "AppData/Local/Temp/gitgo-final-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python -B -c "import sys; from pathlib import Path; from backend.core.update.windows_storage import create_private_directory; p=Path(sys.argv[1]); create_private_directory(p); create_private_directory(p/'unpacked')" $private
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GITGO_FINAL_PACKAGE_ROOT=$private" >> $env:GITHUB_ENV
          "TEMP=$private" >> $env:GITHUB_ENV
          "TMP=$private" >> $env:GITHUB_ENV
      - name: Build, archive, then unpack final Windows ZIP
        run: |
          & packaging/build_windows.ps1 -Python (Get-Command python).Source -Bun (Get-Command bun).Source -Ripgrep $env:GITGO_RIPGREP_PATH -RipgrepNotices $env:GITGO_RIPGREP_NOTICES -ManagedUpdate -UpdateReleasePolicy packaging/release-trust/windows-x86_64.json -Output "$env:GITGO_FINAL_PACKAGE_ROOT/stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archives = @(Get-ChildItem dist-installer/*.zip)
          if ($archives.Count -ne 1) { throw 'Expected exactly one final Windows archive from build_windows.ps1' }
          $archive = $archives[0]
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath "$env:GITGO_FINAL_PACKAGE_ROOT/unpacked"
          python -B scripts/smoke_packaged_runtime.py --host "$env:GITGO_FINAL_PACKAGE_ROOT/unpacked/internal/gitgo-host/gitgo-host.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/check_terminal_continuity.py --host "$env:GITGO_FINAL_PACKAGE_ROOT/unpacked/internal/gitgo-host/gitgo-host.exe" --dashboard "$env:GITGO_FINAL_PACKAGE_ROOT/unpacked/gitgo.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual final ZIP native boundaries
        run: |
          $env:GITGO_SANDBOX_TEST_HOST = "$env:GITGO_FINAL_PACKAGE_ROOT/unpacked/internal/gitgo-host/gitgo-host.exe"
          python -B -m pytest tests/test_native_sandbox.py tests/test_windows_sandbox_minimum.py -k packaged -q --tb=short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-final-zip
          path: dist-installer/*
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CI gate
    needs: [contract, privacy, python-windows, dashboard, native, native-linux, runtime, unix-packages, windows-package, managed-update-windows, managed-update-linux]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Fail closed on failure, cancellation, or an unexpected skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          required = ['contract', 'privacy', 'python-windows', 'dashboard', 'runtime',
                      'windows-package', 'managed-update-windows', 'unix-packages',
                      'managed-update-linux']
          summary = ['## Alpha3 platform gate', '', 'All release targets must pass:']
          for name in [*required, 'native', 'native-linux']:
              summary.append('- ' + name + ': ' + jobs[name]['result'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('\n'.join(summary) + '\n')
          failed = [name for name in required if jobs[name]['result'] != 'success']
          native_required = jobs['contract']['outputs'].get('native_required') == 'true'
          expected_native = 'success' if native_required else 'skipped'
          for name in ['native', 'native-linux']:
              if jobs[name]['result'] != expected_native:
                  failed.append(name)
          if failed:
              raise SystemExit('Required platform CI did not succeed: ' + ', '.join(failed))
          print('Platform CI passed for the recorded candidate tree. Owner trial approval is still required before publication.')
          PY
