name: Gitgo CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitgo-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: PR contract and upstream alignment
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      native_required: ${{ steps.contract.outputs.native_required }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: upstream
          persist-credentials: false
      - name: Verify gate regressions
        run: python3 -I -B candidate/tests/test_ci_pr_contract.py
      - name: Verify PR version, declared boundaries, and upstream ancestry
        id: contract
        working-directory: candidate
        run: python3 -I -B scripts/check_pr_contract.py --root . --base-root ../upstream
      - name: Record tested candidate and integration tree
        working-directory: candidate
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          python3 -I -B - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          evidence = {'event': os.environ['GITHUB_EVENT_NAME'], 'head': os.environ.get('PR_HEAD'),
              'observed_base': os.environ.get('PR_BASE'), 'tested_commit': git('rev-parse', 'HEAD'),
              'tested_tree': git('rev-parse', 'HEAD^{tree}'), 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'formal_terminal_verified': False}
          Path('ci-evidence.json').write_text(json.dumps(evidence, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-candidate-evidence
          path: candidate/ci-evidence.json
          if-no-files-found: error
          retention-days: 14

  privacy:
    name: Tracked-file privacy boundary
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: python3 -B scripts/verify_release_privacy.py --root .

  python-windows:
    name: Windows source regression
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install test dependencies
        run: python -m pip install -r requirements-portable.txt pytest
      - name: Validate pinned SQLite and ripgrep
        run: |
          python -B scripts/provision_ci_sqlite.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/provision_ci_ripgrep.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GITGO_BUN=$((Get-Command bun).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python --version
      - name: Full Python suite
        run: python -B -m pytest tests -q --junitxml=ci-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-source-results
          path: ci-tests.xml
          if-no-files-found: warn
          retention-days: 14

  dashboard:
    name: Dashboard tests and production build
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - working-directory: cli/dashboard
        run: bun install --frozen-lockfile
      - working-directory: cli/dashboard
        run: bun test
      - working-directory: cli/dashboard
        run: bun run build

  native:
    name: Native sandbox (${{ matrix.os }})
    needs: contract
    if: needs.contract.outputs.native_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: runner.os == 'Windows'
        with:
          bun-version: '1.4.2'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap gcc patchelf libseccomp2
      - run: python -m pip install -r requirements-portable.txt pytest pyinstaller
      - run: python -B scripts/provision_ci_sqlite.py
      - run: python -B scripts/provision_ci_ripgrep.py
      - name: Windows ACL preflight
        if: runner.os == 'Windows'
        run: |
          "GITGO_BUN=$((Get-Command bun).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python -B -m pytest tests/test_windows_acl_provisioning.py -q -x
      - name: Windows real source and frozen acceptance
        if: runner.os == 'Windows'
        run: python -B scripts/run_sandbox_acceptance.py
      - name: Linux delegated source and frozen acceptance
        if: runner.os == 'Linux'
        run: >-
          sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -u)"
          --working-directory="$PWD" --setenv="GITGO_RIPGREP_PATH=$GITGO_RIPGREP_PATH"
          --unit=gitgo-sandbox-ci -p Delegate=yes "$(which python)" -B
          scripts/run_linux_sandbox_scope.py -- "$(which python)" -B scripts/run_sandbox_acceptance.py

  gate:
    name: CI gate
    needs: [contract, privacy, python-windows, dashboard, native]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Fail closed on failure, cancellation, or an unexpected skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          required = ['contract', 'privacy', 'python-windows', 'dashboard']
          failed = [name for name in required if jobs[name]['result'] != 'success']
          native_required = jobs['contract']['outputs'].get('native_required') == 'true'
          expected_native = 'success' if native_required else 'skipped'
          if jobs['native']['result'] != expected_native:
              failed.append('native')
          if failed:
              raise SystemExit('Required CI did not succeed: ' + ', '.join(failed))
          print('CI passed for the recorded candidate tree. Human design/terminal review remains required.')
          PY
