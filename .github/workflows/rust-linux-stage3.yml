name: Rust Linux execution stage 3 acceptance
on:
  push:
    branches: [test/45-linux-stage3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cgroup-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
      - uses: ./.github/actions/build-sandbox-native
      - name: Compile exact Rust tests before delegated execution
        run: cargo +1.90.0 test --locked --manifest-path native/sandbox/Cargo.toml --no-run
      - name: Actual delegated cgroup-v2 limits and retirement
        shell: bash
        run: |
          set -euo pipefail
          sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -u)" \
            --working-directory="$PWD" --setenv="PATH=$PATH" \
            --setenv="CARGO_HOME=$HOME/.cargo" --setenv="RUSTUP_HOME=$HOME/.rustup" \
            --unit=gitgo-rust-stage3-core -p Delegate=yes "$(which python)" -B \
            scripts/run_linux_sandbox_scope.py -- \
            cargo +1.90.0 test --offline --locked --manifest-path native/sandbox/Cargo.toml \
            linux_cgroup -- --nocapture --test-threads=1
      - name: Ordinary read and ABI units remain intact
        run: cargo +1.90.0 test --offline --locked --manifest-path native/sandbox/Cargo.toml
      - name: Native execution prerequisites
        run: bash scripts/prepare_linux_update_ci.sh
      - name: Locked Python dependencies and trusted fixtures
        run: |
          python -m pip install --require-hashes -r packaging/requirements-build.lock
          python -B scripts/provision_ci_sqlite.py
          python -B scripts/provision_ci_ripgrep.py
      - name: Actual isolated tools, cancellation, budgets and resource recovery
        shell: bash
        run: |
          set -euo pipefail
          sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -u)" \
            --working-directory="$PWD" --setenv="LD_LIBRARY_PATH=$LD_LIBRARY_PATH" \
            --setenv="GITGO_RIPGREP_PATH=$GITGO_RIPGREP_PATH" \
            --unit=gitgo-rust-stage3-tools -p Delegate=yes "$(which python)" -B \
            scripts/run_linux_sandbox_scope.py -- "$(which python)" -B -m pytest \
            tests/test_native_sandbox.py tests/test_runtime_cleanup_evidence.py \
            tests/test_native_sandbox_abi.py tests/test_linux_cgroup_native.py tests/test_publish_recovery.py -q --tb=short --junitxml=linux-stage3.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stage3-${{ matrix.os }}
          path: linux-stage3.xml
          if-no-files-found: error
  frozen-native:
    needs: cgroup-core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    uses: ./.github/workflows/native-acceptance.yml
    with:
      os: ${{ matrix.os }}
