name: Rust Linux execution stage 3 acceptance
on:
  push:
    branches: [test/45-linux-stage3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cgroup-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
      - uses: ./.github/actions/build-sandbox-native
      - name: Compile exact Rust tests before delegated execution
        run: cargo +1.90.0 test --locked --manifest-path native/sandbox/Cargo.toml --no-run
      - name: Actual delegated cgroup-v2 limits and retirement
        shell: bash
        run: |
          set -euo pipefail
          sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -u)" \
            --working-directory="$PWD" --setenv="PATH=$PATH" \
            --setenv="CARGO_HOME=$HOME/.cargo" --setenv="RUSTUP_HOME=$HOME/.rustup" \
            --unit=gitgo-rust-stage3-core -p Delegate=yes "$(which python)" -B \
            scripts/run_linux_sandbox_scope.py -- \
            cargo +1.90.0 test --offline --locked --manifest-path native/sandbox/Cargo.toml \
            linux_cgroup -- --nocapture --test-threads=1
      - name: Ordinary read and ABI units remain intact
        run: cargo +1.90.0 test --offline --locked --manifest-path native/sandbox/Cargo.toml
