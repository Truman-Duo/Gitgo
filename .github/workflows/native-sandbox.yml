name: Native sandbox security
on:
  push:
    branches: ["codex/issue-17-native-sandbox"]
  pull_request:
    paths:
      - "backend/core/sandbox*.py"
      - "backend/core/loop/**"
      - "backend/core/tools/**"
      - "tests/test_native_sandbox.py"
      - "tests/conftest.py"
      - ".github/workflows/native-sandbox.yml"
permissions:
  contents: read
jobs:
  security:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python -m pip install -r requirements-portable.txt
      - run: python -B -m pytest tests/test_native_sandbox.py -q
