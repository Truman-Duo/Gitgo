name: Native sandbox security
on:
  push:
    branches: ["codex/issue-17-native-sandbox"]
  workflow_call:
    inputs:
      audit_only:
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    if: ${{ !inputs.audit_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - if: runner.os == 'Linux'
        run: bash scripts/prepare_linux_update_ci.sh
      - run: python -m pip install -r requirements-portable.txt pyinstaller
      - name: Provision and validate pinned patched SQLite in CI
        run: python -B scripts/provision_ci_sqlite.py
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: runner.os == 'Windows'
        with:
          bun-version: "1.4.4"
      - name: Configure owned Windows handoff lifecycle runtime
        if: runner.os == 'Windows'
        run: |
          bun --version
          "GITGO_BUN=$((Get-Command bun).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Provision and validate pinned official ripgrep in CI
        run: python -B scripts/provision_ci_ripgrep.py
      - name: Build and test native storage lifetime ownership
        if: runner.os == 'Windows'
        run: |
          $compiler = (Get-Command clang.exe -ErrorAction Stop).Source
          & $compiler --version
          $output = Join-Path $env:RUNNER_TEMP 'gitgo-storage-native'
          python -B scripts/build_storage_native.py --compiler $compiler --output $output --sqlite-header dev-artifacts/ci-sqlite/sqlite3.h --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GITGO_STORAGE_NATIVE_TEST_LIBRARY = Join-Path $output 'gitgo-storage-scope.dll'
          $env:GITGO_STORAGE_CANONICAL_TEST = "1"
          python -B -m pytest tests/test_storage_operational_profile.py tests/test_storage_operational_workers.py tests/test_storage_operational_recovery.py tests/test_storage_protected_entry.py tests/test_storage_cycle_slot.py tests/test_storage_write_window.py tests/test_storage_batch_sql.py tests/test_storage_batch_retirement.py tests/test_storage_cycle_ledger.py tests/test_storage_project_records.py tests/test_storage_database_pins.py tests/test_storage_project_namespace.py tests/test_storage_project_workers.py tests/test_storage_cas_ownership.py tests/test_storage_windows_cas.py tests/test_storage_sqlite_ownership.py tests/test_storage_windows_sqlite.py tests/test_storage_windows_scope.py tests/test_storage_windows_process.py tests/test_storage_windows_journal.py tests/test_storage_windows_tree.py tests/test_storage_windows_host.py tests/test_storage_host_records.py tests/test_storage_runtime_manifest.py tests/test_storage_runtime_installation.py tests/test_storage_runtime_control.py tests/test_storage_runtime_worker.py tests/test_storage_runtime_launch.py tests/test_storage_runtime_lifecycle.py tests/test_storage_runtime_recovery.py tests/test_storage_slot_records.py tests/test_storage_runtime_records.py -q -x
      - name: Windows ACL recovery preflight
        if: runner.os == 'Windows'
        run: python -B -m pytest tests/test_windows_security_descriptor.py tests/test_windows_security_privileges.py tests/test_windows_acl_plan.py tests/test_windows_acl_provisioning.py tests/test_windows_acl_inheritance.py tests/test_windows_acl_sacl_inheritance.py tests/test_windows_acl_management.py -q -x
      - name: Windows source and packaged isolation
        if: runner.os == 'Windows'
        run: python -B scripts/run_sandbox_acceptance.py --storage-native-library "$env:RUNNER_TEMP\gitgo-storage-native\gitgo-storage-scope.dll"
      - name: Linux source and packaged isolation in delegated service
        if: runner.os == 'Linux'
        run: sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -u)" --working-directory="$PWD" --setenv="LD_LIBRARY_PATH=$LD_LIBRARY_PATH" --setenv="GITGO_RIPGREP_PATH=$GITGO_RIPGREP_PATH" --unit=gitgo-sandbox-ci -p Delegate=yes "$(which python)" -B scripts/run_linux_sandbox_scope.py -- "$(which python)" -B scripts/run_sandbox_acceptance.py

  macos-audit:
    name: macOS capability audit (not backend acceptance) (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-portable.txt
      - name: Audit native primitives and verify production stays closed
        run: python -B scripts/probe_macos_sandbox.py --output dev-artifacts/macos-capabilities.json
      - name: Diagnose native launch failures
        if: failure()
        run: |
          sudo /usr/bin/log show --last 3m --style compact --predicate 'eventMessage CONTAINS "GitgoMacAudit"' | tail -80
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted((Path.home() / 'Library/Logs/DiagnosticReports').glob('*'))[-12:]:
              if p.suffix == '.ips' and ('Python' in p.name or 'sandbox-exec' in p.name or 'echo' in p.name):
                  try:
                      payload = json.loads(p.read_text().split('\n', 1)[1])
                      print(p.name, json.dumps({k: payload.get(k) for k in ('exception', 'termination', 'asi')}))
                  except (OSError, ValueError):
                      pass
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-capabilities-${{ matrix.os }}
          path: dev-artifacts/macos-capabilities.json
          include-hidden-files: true
          if-no-files-found: error

  dashboard:
    if: ${{ !inputs.audit_only }}
    name: Dashboard regression and production build
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - name: Verify runtime and install locked dependencies
        working-directory: cli/dashboard
        run: |
          bun --version
          bun install --frozen-lockfile
      - name: Dashboard tests
        working-directory: cli/dashboard
        run: bun test
      - name: Dashboard production build
        working-directory: cli/dashboard
        run: bun run build
