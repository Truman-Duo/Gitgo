name: Native sandbox security
on:
  push:
    branches: ["codex/issue-17-native-sandbox"]
  pull_request:
    paths:
      - "backend/core/sandbox*.py"
      - "backend/core/loop/**"
      - "backend/core/tools/**"
      - "tests/test_native_sandbox.py"
      - "tests/conftest.py"
      - ".github/workflows/native-sandbox.yml"
permissions:
  contents: read
jobs:
  security:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python -m pip install -r requirements-portable.txt pyinstaller
      - name: Windows source and packaged isolation
        if: runner.os == 'Windows'
        run: python -B scripts/run_sandbox_acceptance.py
      - name: Linux source and packaged isolation in delegated service
        if: runner.os == 'Linux'
        run: sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -u)" --working-directory="$PWD" --setenv="LD_LIBRARY_PATH=$LD_LIBRARY_PATH" --unit=gitgo-sandbox-ci -p Delegate=yes "$(which python)" -B scripts/run_linux_sandbox_scope.py -- "$(which python)" -B scripts/run_sandbox_acceptance.py
