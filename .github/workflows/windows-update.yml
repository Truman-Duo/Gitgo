name: Windows update acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install source-test dependencies
        run: python -m pip install -r requirements-portable.txt pytest
      - name: Record actual platform and source
        run: |
          python -c "import platform; print(platform.platform(), platform.machine())"
          git rev-parse HEAD
      - name: Actual NTFS ownership and lock tests
        run: python -B -m pytest tests/test_update_windows_storage.py -q --junitxml=windows-update.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-update-results
          path: windows-update.xml
          if-no-files-found: error
          retention-days: 7
