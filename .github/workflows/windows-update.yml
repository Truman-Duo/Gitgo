name: Windows update acceptance

on:
  push:
    branches: [test/21-windows-update]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install source-test dependencies
        run: python -m pip install -r requirements-portable.txt pytest
      - name: Record actual platform and source
        run: |
          python -c "import platform; print(platform.platform(), platform.machine())"
          git rev-parse HEAD
      - name: Use the runner's private user-profile temporary directory
        run: |
          # The shared D: Actions scratch drive grants ordinary groups write
          # access. It is intentionally not an admissible managed-install root.
          $testTemp = Join-Path $env:USERPROFILE 'AppData\Local\Temp'
          if (!(Test-Path -LiteralPath $testTemp -PathType Container)) { throw 'Private temporary parent missing' }
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
      - name: Provision the pinned safe CI SQLite runtime
        run: python -B scripts/provision_ci_sqlite.py
      - name: Actual NTFS ownership and lock tests
        run: python -B -m pytest tests/test_update_windows_storage.py tests/test_update_windows_transaction.py tests/test_update_windows_managed.py tests/test_windows_owned_job.py -q --tb=short --junitxml=windows-update.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-update-results
          path: windows-update.xml
          if-no-files-found: error
          retention-days: 7
