name: Windows update acceptance

on:
  push:
    branches: [test/21-windows-update]
    paths-ignore:
      - .github/workflows/linux-update.yml
      - scripts/linux_update_ci_build.py
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install source-test dependencies
        run: python -m pip install -r requirements-portable.txt pytest
      - name: Record actual platform and source
        run: |
          python -c "import platform; print(platform.platform(), platform.machine())"
          git rev-parse HEAD
      - name: Use the runner's private user-profile temporary directory
        run: |
          # The shared D: Actions scratch drive grants ordinary groups write
          # access. It is intentionally not an admissible managed-install root.
          $testTemp = Join-Path $env:USERPROFILE 'AppData\Local\Temp'
          if (!(Test-Path -LiteralPath $testTemp -PathType Container)) { throw 'Private temporary parent missing' }
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
      - name: Provision the pinned safe CI SQLite runtime
        run: python -B scripts/provision_ci_sqlite.py
      - name: Actual NTFS ownership and lock tests
        run: python -B -m pytest tests/test_update_windows_storage.py tests/test_update_windows_transaction.py tests/test_update_windows_managed.py tests/test_windows_owned_job.py -q --tb=short --junitxml=windows-update.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-update-results
          path: windows-update.xml
          if-no-files-found: error
          retention-days: 7

  frozen:
    needs: native
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Private temporary profile and build dependencies
        run: |
          $testTemp = Join-Path $env:USERPROFILE 'AppData\Local\Temp'
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
          "PYTHONUTF8=1" >> $env:GITHUB_ENV
          "PYTHONIOENCODING=utf-8" >> $env:GITHUB_ENV
          "GITGO_BUN=$((Get-Command bun).Source)" >> $env:GITHUB_ENV
          python -m pip install -r requirements-portable.txt pytest 'pyinstaller==6.22.3'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/provision_ci_sqlite.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/provision_ci_ripgrep.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full Windows source regression
        run: python -B -m pytest tests -q --tb=short --junitxml=windows-source.xml
      - name: Dashboard Windows tests and production build
        working-directory: cli/dashboard
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build two independently committed real Windows packages
        run: python -B scripts/windows_update_ci_build.py --bun (Get-Command bun).Source
      - name: Actual public Windows installer smoke
        run: python -B -m pytest tests/test_update_windows_frozen.py -k installer -q --tb=short --junitxml=windows-installer.xml
      - name: Actual frozen Windows update rollback and recovery
        run: python -B -m pytest tests/test_update_windows_frozen.py -q --tb=short --junitxml=windows-frozen.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-source-and-frozen-results
          path: |
            windows-source.xml
            windows-installer.xml
            windows-frozen.xml
          if-no-files-found: warn
          retention-days: 7
