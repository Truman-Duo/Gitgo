name: Native platform acceptance
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  native:
    name: Native sandbox (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: runner.os == 'Windows'
        with:
          bun-version: '1.4.2'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap gcc patchelf libseccomp2
      - run: python -m pip install -r requirements-portable.txt pytest pyinstaller
      - name: Prepare canonical Windows temporary directory
        if: runner.os == 'Windows'
        run: |
          @'
          import os
          from pathlib import Path
          root = (Path(os.environ['USERPROFILE']) / 'AppData/Local/Temp').resolve(strict=True) / 'gitgo-tests'
          root.mkdir(exist_ok=True)
          root = root.resolve(strict=True)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              output.write(f'TEMP={root}\nTMP={root}\n')
          print(f'Test temporary directory: {root}')
          '@ | python -I -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -B scripts/provision_ci_sqlite.py
      - run: python -B scripts/provision_ci_ripgrep.py
      - name: CAS format admission and process ordering foundations
        run: >-
          python -B -m pytest tests/test_cas_lifecycle_ordering.py tests/test_cas_inventory.py
          tests/test_storage_ownership_handoff.py
          tests/test_storage_binding_retirement.py tests/test_storage_envelope.py tests/test_storage_host_records.py tests/test_storage_runtime_manifest.py tests/test_storage_slot_records.py tests/test_storage_runtime_records.py tests/test_storage_wal_capacity.py tests/test_checkpoint_limits.py tests/test_checkpoint_work.py tests/test_checkpoint_binding.py tests/test_storage_project_registration.py tests/test_checkpoint_facts.py tests/test_storage_repository_outcomes.py tests/test_checkpoint_planning.py tests/test_runtime_facts.py
          tests/test_storage_protocol_admission.py tests/test_storage_recovery_boundaries.py
          tests/test_storage_transaction_outcomes.py tests/test_sqlite_storage.py -q
      - name: Windows ACL preflight
        if: runner.os == 'Windows'
        run: |
          "GITGO_BUN=$((Get-Command bun).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python -B -m pytest tests/test_windows_acl_provisioning.py -q -x
      - name: Build and validate native storage lifetime and journals
        if: runner.os == 'Windows'
        run: |
          $compiler = (Get-Command clang.exe -ErrorAction Stop).Source
          & $compiler --version
          $output = Join-Path $env:RUNNER_TEMP 'gitgo-storage-native'
          python -B scripts/build_storage_native.py --compiler $compiler --output $output --sqlite-header dev-artifacts/ci-sqlite/sqlite3.h --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GITGO_STORAGE_NATIVE_TEST_LIBRARY = Join-Path $output 'gitgo-storage-scope.dll'
          $env:GITGO_STORAGE_CANONICAL_TEST = "1"
          python -B -m pytest tests/test_storage_operational_profile.py tests/test_storage_operational_workers.py tests/test_storage_operational_recovery.py tests/test_storage_protected_entry.py tests/test_storage_cycle_slot.py tests/test_storage_write_window.py tests/test_storage_batch_sql.py tests/test_storage_batch_retirement.py tests/test_storage_cycle_ledger.py tests/test_storage_project_records.py tests/test_storage_database_pins.py tests/test_storage_project_namespace.py tests/test_storage_project_workers.py tests/test_storage_cas_ownership.py tests/test_storage_windows_cas.py tests/test_storage_sqlite_ownership.py tests/test_storage_windows_sqlite.py tests/test_storage_windows_scope.py tests/test_storage_windows_process.py tests/test_storage_windows_journal.py tests/test_storage_windows_tree.py tests/test_storage_windows_host.py tests/test_storage_host_records.py tests/test_storage_runtime_manifest.py tests/test_storage_runtime_installation.py tests/test_storage_runtime_control.py tests/test_storage_runtime_worker.py tests/test_storage_runtime_launch.py tests/test_storage_runtime_lifecycle.py tests/test_storage_runtime_recovery.py tests/test_storage_slot_records.py tests/test_storage_runtime_records.py -q -x
      - name: Windows real source and frozen acceptance
        if: runner.os == 'Windows'
        run: python -B scripts/run_sandbox_acceptance.py --storage-native-library "$env:RUNNER_TEMP\gitgo-storage-native\gitgo-storage-scope.dll"
      - name: Linux delegated source and frozen acceptance
        if: runner.os == 'Linux'
        run: >-
          sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -u)"
          --working-directory="$PWD" --setenv="GITGO_RIPGREP_PATH=$GITGO_RIPGREP_PATH"
          --unit=gitgo-sandbox-ci -p Delegate=yes "$(which python)" -B
          scripts/run_linux_sandbox_scope.py -- "$(which python)" -B scripts/run_sandbox_acceptance.py

