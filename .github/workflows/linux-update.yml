name: Linux update acceptance

on:
  workflow_call:
  push:
    branches: [test/21-windows-update]
    paths-ignore:
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Test and build dependencies
        run: |
          umask 022
          python -m pip install --require-hashes -r packaging/requirements-build.lock
          python -B scripts/provision_ci_sqlite.py
          python -B scripts/provision_ci_ripgrep.py
          echo "GITGO_BUN=$(command -v bun)" >> "$GITHUB_ENV"
          uname -a
          git rev-parse HEAD
      - name: Full Linux source regression
        run: |
          umask 022
          python -B -m pytest tests -q --tb=short --junitxml=linux-source.xml
      - name: Dashboard tests and production build
        working-directory: cli/dashboard
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build
      - name: Build two independently committed real Linux bundles
        run: |
          umask 022
          python -B scripts/linux_update_ci_build.py --bun "$(command -v bun)"
      - name: Actual frozen upgrade rollback recovery and compiled UI handoff
        run: |
          umask 022
          python -B -m pytest tests/test_update_two_frozen_versions.py -q --tb=short --junitxml=linux-frozen.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-update-results-${{ matrix.os }}
          path: |
            linux-source.xml
            linux-frozen.xml
          if-no-files-found: warn
          retention-days: 7
