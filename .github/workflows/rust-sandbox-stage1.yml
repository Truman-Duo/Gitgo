name: Rust sandbox stage 1 candidate
on:
  push:
    branches: ["feat/45-rust-native-stage1"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-regression:
    name: Windows publish lifecycle regression
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - uses: ./.github/actions/build-sandbox-native
      - name: Install and validate test runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r packaging/requirements-build.lock
          python -B scripts/provision_ci_sqlite.py
          python -B scripts/provision_ci_ripgrep.py
      - name: Current native failure and publish cancellation paths
        id: current
        shell: pwsh
        run: |
          $private = Join-Path $env:USERPROFILE 'AppData/Local/Temp'
          $env:TEMP = $private
          $env:TMP = $private
          $env:GITGO_BUN = (Get-Command bun).Source
          python -B -c "import faulthandler,pytest; faulthandler.dump_traceback_later(18,repeat=True); raise SystemExit(pytest.main(['tests/test_windows_profile_lifecycle.py','tests/test_publish_distribution.py::test_real_native_build_pause_waits_for_retirement_and_does_not_publish','tests/test_publish_queue.py::test_real_native_background_run_checks_environment_then_integrates','-vv','-s']))"
          exit $LASTEXITCODE
      - name: Baseline comparison on the same Windows worker
        if: failure() && steps.current.outcome == 'failure'
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'alpha31-publish-control'
          git worktree add --detach $baseline 172a17a0638550ce128bf752e0756eed91089bf6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TEMP = Join-Path $env:USERPROFILE 'AppData/Local/Temp'
          $env:TMP = $env:TEMP
          $env:GITGO_BUN = (Get-Command bun).Source
          Set-Location $baseline
          python -B -c "import faulthandler,pytest; faulthandler.dump_traceback_later(18,repeat=True); raise SystemExit(pytest.main(['tests/test_publish_distribution.py::test_real_native_build_pause_waits_for_retirement_and_does_not_publish','tests/test_publish_queue.py::test_real_native_background_run_checks_environment_then_integrates','-vv','-s']))"
          exit $LASTEXITCODE
  native-acceptance:
    uses: ./.github/workflows/native-sandbox.yml
