name: Rust sandbox stage 1 candidate
on:
  push:
    branches: ["feat/45-rust-native-stage1", "feat/45-windows-rust-review"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-regression:
    name: Windows publish lifecycle regression
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - uses: ./.github/actions/build-sandbox-native
      - name: Install and validate test runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-portable.txt pyinstaller
          python -B scripts/provision_ci_sqlite.py
          python -B scripts/provision_ci_ripgrep.py
      - name: Current native failure and publish cancellation paths
        id: current
        shell: pwsh
        run: |
          $private = Join-Path $env:USERPROFILE 'AppData/Local/Temp'
          $env:TEMP = $private
          $env:TMP = $private
          $env:GITGO_BUN = (Get-Command bun).Source
          @'
          import faulthandler, functools, importlib.util, json, threading, time
          import pytest
          from backend.core.sandbox_access import WorkspaceAccess
          totals, lock = {}, threading.Lock()
          def measure(owner, name, label):
              original = getattr(owner, name)
              @functools.wraps(original)
              def measured(*args, **kwargs):
                  key = label(args, kwargs)
                  started = time.perf_counter()
                  try:
                      return original(*args, **kwargs)
                  finally:
                      elapsed = time.perf_counter() - started
                      with lock:
                          count, seconds = totals.get(key, (0, 0.0))
                          totals[key] = (count + 1, seconds + elapsed)
              setattr(owner, name, measured)
          for name in ('prepare', 'close'):
              measure(WorkspaceAccess, name, lambda a, k, n=name: 'workspace_' + n)
          if importlib.util.find_spec('backend.core.native_sandbox') is not None:
              from backend.core.native_sandbox import NativeLibrary
              measure(NativeLibrary, 'call', lambda a, k: 'native_' + k.get('op', 'unknown'))
              measure(NativeLibrary, 'acl', lambda a, k: 'descriptor_' + str(a[1]))
          faulthandler.dump_traceback_later(18, repeat=True)
          result = 0
          for attempt in range(3):
              result = max(result, int(pytest.main([
                  'tests/test_windows_profile_lifecycle.py',
                  'tests/test_native_sandbox.py::test_failed_resource_monitor_kills_started_tool',
                  'tests/test_publish_distribution.py::test_real_native_build_pause_waits_for_retirement_and_does_not_publish',
                  'tests/test_publish_queue.py::test_real_native_background_run_checks_environment_then_integrates',
                  '-vv', '-s', '--durations=10'])))
              print('Boundary timings', attempt + 1, json.dumps(totals, sort_keys=True), flush=True)
              totals.clear()
          raise SystemExit(result)
          '@ | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'publish-measure.py')
          python -B -c "import sys; exec(open(sys.argv[1],encoding='utf-8-sig').read())" (Join-Path $env:RUNNER_TEMP 'publish-measure.py')
          exit $LASTEXITCODE
      - name: Baseline comparison on the same Windows worker
        if: failure() && steps.current.outcome == 'failure'
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'alpha31-publish-control'
          git worktree add --detach $baseline 15e5a82a5510adaa658535d87f5b657e5c21e545
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TEMP = Join-Path $env:USERPROFILE 'AppData/Local/Temp'
          $env:TMP = $env:TEMP
          $env:GITGO_BUN = (Get-Command bun).Source
          Set-Location $baseline
          python -B -c "import sys; exec(open(sys.argv[1],encoding='utf-8-sig').read())" (Join-Path $env:RUNNER_TEMP 'publish-measure.py')
          exit $LASTEXITCODE
  native-acceptance:
    needs: windows-regression
    uses: ./.github/workflows/native-sandbox.yml
